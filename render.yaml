services:
  - type: web
    name: poke-explorer-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:////data/roster.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
